<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fitted Kids</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10091f;color:white;font-family:system-ui,-apple-system,sans-serif}
.app{max-width:540px;margin:auto;min-height:100vh;background:linear-gradient(#241047,#10091f);padding-bottom:80px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px}.logo{font-size:27px;font-weight:1000}.logo b{color:#ff4da8}
.stats{display:flex;gap:6px}.pill{background:#30204e;border-radius:20px;padding:7px 10px;font-weight:900;font-size:12px}
.hero{margin:0 14px;padding:22px 18px;border-radius:26px;background:linear-gradient(135deg,#ff42a5,#7250ff);box-shadow:0 15px 40px #0005}.hero h1{margin:0;font-size:29px}.hero p{font-weight:700}.play,.save{border:0;border-radius:15px;padding:13px 22px;font-weight:1000;cursor:pointer}.play{background:white;color:#27143b}
.section{padding:18px 14px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title h2{margin:0;font-size:18px}.title small{color:#aaa0bf}
.characters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.character{background:#211637;border-radius:21px;padding:10px;text-align:center;border:2px solid transparent;cursor:pointer}.character.active{border-color:#ff4da8}.art{height:170px;background:linear-gradient(#463064,#291a47);border-radius:16px;position:relative;overflow:hidden}
.person{position:absolute;width:120px;height:158px;left:50%;bottom:6px;transform:translateX(-50%)}.head{position:absolute;left:33px;top:18px;width:55px;height:65px;background:#89553d;border-radius:48%;z-index:2}.hair{position:absolute;left:24px;top:3px;width:74px;height:48px;background:#17121a;border-radius:50%;z-index:3}.girl .hair{height:57px}.eyes{position:absolute;left:47px;top:50px;display:flex;gap:17px;z-index:5}.eyes i{width:5px;height:5px;background:#20121a;border-radius:50%}.body{position:absolute;left:21px;top:82px;width:80px;height:59px;background:#ff4da8;border-radius:17px}.girl .body{background:#8052ff}.bottom{position:absolute;left:29px;top:133px;width:65px;height:27px;background:#19192a;border-radius:8px}.shoe:before,.shoe:after{content:"";position:absolute;top:155px;width:31px;height:11px;background:white;border-radius:9px}.shoe:before{left:22px}.shoe:after{right:22px}
.challenge{display:grid;grid-template-columns:1.3fr .7fr;gap:9px}.card{min-height:145px;padding:15px;border-radius:20px;background:linear-gradient(135deg,#00b7ff,#405bff);position:relative}.card:nth-child(2){background:linear-gradient(135deg,#ff9c2e,#ff4b88)}.card h3{margin:0 0 5px}.card p{font-size:12px;color:#fffd}.go{position:absolute;bottom:12px;left:15px;border:0;border-radius:10px;padding:7px 11px;font-weight:900}
.screen{display:none}.screen.active{display:block}.back{border:0;background:#2b1d48;color:white;border-radius:11px;padding:8px 12px}.closethead{padding:15px;display:flex;gap:10px;align-items:center}.closethead h2{margin:0}.tabs{display:flex;gap:7px;overflow:auto;padding:0 14px 10px}.tab{border:0;border-radius:12px;background:#291c43;color:#bbb0ce;padding:9px 12px;font-weight:850;white-space:nowrap}.tab.active{background:white;color:#21122f}.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:5px 14px}.item{border:1px solid #ffffff12;background:#21173a;color:white;border-radius:17px;padding:10px;min-height:92px;cursor:pointer}.item.active{outline:2px solid #ffd84d}.emoji{display:block;font-size:30px}.item small{font-size:10px;color:#c8bfd6}.save{margin:14px;width:calc(100% - 28px);background:linear-gradient(90deg,#ffd84d,#ff9e35);color:#24142f}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#17102ddd;backdrop-filter:blur(12px);padding:9px}.navbtn{border:0;background:none;color:#a69bb9;font-weight:800}.navbtn span{display:block;font-size:20px}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:white;color:#20122f;padding:11px 16px;border-radius:99px;font-weight:900;opacity:0;transition:.2s}.toast.show{opacity:1}
</style></head><body><div class="app">
<header><div class="logo">FITTED <b>KIDS</b></div><div class="stats"><div class="pill">🪙 <span id="coins">1,250</span></div><div class="pill">⭐ <span id="stars">5</span></div></div></header>
<main id="home" class="screen active">
<section class="hero"><h1>Build Your Fit ✨</h1><p>Be bold. Be creative. Be YOU.</p><button class="play" onclick="openCloset()">PLAY NOW</button></section>
<section class="section"><div class="title"><h2>Choose Your Character</h2><small>Change anytime</small></div>
<div class="characters">
<div class="character active" data-c="girl" onclick="char('girl')"><div class="art"><div class="person girl"><div class="head"></div><div class="hair"></div><div class="eyes"><i></i><i></i></div><div class="body"></div><div class="bottom"></div><div class="shoe"></div></div></div><b>GIRL</b><small>Creative • Confident</small></div>
<div class="character" data-c="boy" onclick="char('boy')"><div class="art"><div class="person boy"><div class="head"></div><div class="hair"></div><div class="eyes"><i></i><i></i></div><div class="body"></div><div class="bottom"></div><div class="shoe"></div></div></div><b>BOY</b><small>Fresh • Fearless</small></div>
</div></section>
<section class="section"><div class="title"><h2>🔥 Today's Challenges</h2><small>Earn rewards</small></div><div class="challenge">
<div class="card"><h3>Back to School</h3><p>Create a first-day look.</p><button class="go" onclick="challenge('Back to School')">STYLE IT</button>🎒</div>
<div class="card"><h3>Sports Star</h3><p>Build game-day style.</p><button class="go" onclick="challenge('Sports Star')">STYLE IT</button>🏀</div>
</div></section></main>
<main id="closet" class="screen"><div class="closethead"><button class="back" onclick="show('home')">←</button><h2>My Closet</h2></div><div class="tabs" id="tabs"></div><div class="wardrobe" id="wardrobe"></div><button class="save" onclick="saveFit()">💾 SAVE MY FIT</button></main>
<nav><button class="navbtn" onclick="show('home')"><span>🏠</span>Home</button><button class="navbtn" onclick="openCloset()"><span>👚</span>Closet</button><button class="navbtn" onclick="challenge('Daily Style')"><span>🏆</span>Challenges</button><button class="navbtn" onclick="toast('More features coming soon ✨')"><span>⚙️</span>Settings</button></nav>
</div><div class="toast" id="toast"></div>
<script>
const data={Hair:[['🎀','Puff Buns'],['🧶','Box Braids'],['🖤','Locs'],['🌀','Curly Afro'],['⚡','Twists'],['✨','High-Top Fade']],Tops:[['🩷','Pink Hoodie'],['👕','Graphic Tee'],['🏀','Varsity Jacket'],['💜','Crewneck'],['🧥','Denim Jacket'],['⚡','Track Top']],Bottoms:[['👖','Cargo Pants'],['👖','Wide-Leg Jeans'],['🩶','Joggers'],['💜','Pleated Skirt'],['🩳','Shorts'],['🩵','Denim Skirt']],Shoes:[['👟','Fresh Sneakers'],['👟','High-Tops'],['🏀','Court Kicks'],['✨','Classic Trainers'],['🔥','Chunky Kicks'],['⭐','Slip-Ons']],Accessories:[['⛓️','Chain'],['💎','Hoops'],['🧢','Cap'],['🕶️','Sunglasses'],['🎒','Backpack'],['📿','Bracelet']]};
let state={char:'girl',cat:'Hair',selected:{},coins:1250,stars:5};
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function openCloset(){show('closet');render()}
function char(c){state.char=c;document.querySelectorAll('.character').forEach(x=>x.classList.toggle('active',x.dataset.c===c));toast(c==='girl'?'Girl selected 💖':'Boy selected 💙')}
function render(){tabs.innerHTML='';Object.keys(data).forEach(c=>{let b=document.createElement('button');b.className='tab '+(state.cat===c?'active':'');b.textContent=c;b.onclick=()=>{state.cat=c;render()};tabs.appendChild(b)});wardrobe.innerHTML='';data[state.cat].forEach((x,i)=>{let b=document.createElement('button');b.className='item '+(state.selected[state.cat]===i?'active':'');b.innerHTML='<span class="emoji">'+x[0]+'</span><small>'+x[1]+'</small>';b.onclick=()=>{state.selected[state.cat]=i;render();toast(x[1]+' selected!')};wardrobe.appendChild(b)})}
function saveFit(){state.coins+=50;state.stars++;update();localStorage.setItem('fkV2',JSON.stringify(state));toast('Fit saved! +50 coins +1 star ⭐')}
function challenge(n){state.coins+=100;state.stars++;update();toast(n+' challenge! +100 coins 🔥');openCloset()}
function update(){coins.textContent=state.coins.toLocaleString();stars.textContent=state.stars}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
try{let s=JSON.parse(localStorage.getItem('fkV2'));if(s)state=s}catch(e){}update()
</script></body></html>
